<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch { return false } };
const I = window.MabuI18n; I.set(I.detect());
function setLang(v) { save("mabu_lang", v); const p = I.path(v); if (!window.__LIVE && location.pathname.replace(/\/$/, "") !== p.replace(/\/$/, "")) { location.href = p; return; } I.set(v); go(cur); }
const U = m => Object.assign(new Error(m), { u: 1 });
const cred = () => load("mabu_cred", 5), setCred = v => save("mabu_cred", Math.max(0, v));
const nome = () => load("mabu_user", "estudante");
const saud = () => { const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; };
/* Google Analytics: só carrega com ID válido, sem Do Not Track e se a pessoa não desativou. Nunca envia conteúdo de documentos. */
const CFG = { ga: "G-XXXXXXXXXX" };
const gaOn = () => /^G-[A-Z0-9]{6,}$/.test(CFG.ga) && CFG.ga !== "G-XXXXXXXXXX" && !load("mabu_ga_off", false) && navigator.doNotTrack !== "1";
function track(n, p) { try { if (window.gtag && gaOn()) gtag("event", n, p || {}); } catch {} }
(function () { if (!gaOn()) return; window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); }; gtag("js", new Date()); gtag("config", CFG.ga, { anonymize_ip: true });
  const t = document.createElement("script"); t.async = true; t.src = "https://www.googletagmanager.com/gtag/js?id=" + CFG.ga; document.head.appendChild(t); })();
function toggleGA() { save("mabu_ga_off", !load("mabu_ga_off", false)); location.reload(); }
const DIA = 864e5, INTERVALOS = [1, 3, 7];
const C_T = { curto: 0, medio: 1, extenso: 2 }, C_N = { facil: 0, medio: 1, avancado: 2 };
let cur = "home", doc = null, sel = { tam: "curto", niv: "facil", idioma: "auto" }, res = null, qz = null, cz = null, lojaVolta = "home", pdfDoc = null;

/* ---------- utilidades de interface ---------- */
function toast(m) { const t = $("#tt"); t.textContent = I.tr(m); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 4000); }
function ld(m) { $("#ld").hidden = !m; if (m) $("#ldm").textContent = I.tr(m); }
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const ago = t => { const m = (Date.now() - t) / 6e4; return m < 60 ? `há ${Math.max(1, Math.floor(m))} min` : m < 1440 ? `há ${Math.floor(m / 60)} h` : `há ${Math.floor(m / 1440)} d`; };
const ftag = t => `<span class="ft ${t}">${t === "pdf" ? "PDF" : "PPTX"}</span>`;
function topbar(t, back) { return `<div class="top">${back ? `<button class="ic" aria-label="Voltar" onclick="go('${back}')">←</button>` : ""}<h1>${t}</h1><button class="pill" onclick="go('loja')">${cred()} créditos</button></div>`; }
async function baixar(nome, conteudo, tipo) {
  track("exportar", { tipo });
  const dl = window.claude ? await window.claude.use("downloads") : null;
  if (dl) { try { await dl.save({ filename: nome, data: conteudo }); } catch {} return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo })); a.download = nome; a.click();
}

/* ---------- navegação ---------- */
const ICO = { home: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>', bib: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>', estudo: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg>', perfil: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>' };
const NAVS = [["home", ICO.home, "Início"], ["bib", ICO.bib, "Biblioteca"], ["estudo", ICO.estudo, "Estudo"], ["perfil", ICO.perfil, "Perfil"]];
const TABDE = { home: "home", analise: "home", res: "home", quiz: "home", bib: "bib", estudo: "estudo", cartoes: "estudo", perfil: "perfil", loja: "perfil" };

  if (v === "loja" && cur !== "loja") lojaVolta = cur === "quiz" || cur === "cartoes" ? "home" : cur;
  cur = v; document.body.classList.toggle("capa", v === "capa"); track("screen_view", { screen_name: v });
  const R = { capa: vCapa, home: vHome, analise: vAnalise, res: vRes, quiz: vQuiz, cartoes: vCartoes, bib: vBib, estudo: vEstudo, perfil: vPerfil, loja: vLoja };
  $("#v").innerHTML = R[v]();
  $("#nv").innerHTML = v === "capa" ? "" : NAVS.map(([k, g, n]) => `<button class="${TABDE[v] === k ? "on" : ""}" onclick="go('${k}')"><span class="g">${g}</span>${n}</button>`).join("");
  I.apply($("#v")); I.apply($("#nv")); $("#nv").setAttribute("aria-label", I.tr("Navegação")); document.documentElement.lang = I.htmlLang();
  if (v === "home") iniHome();
  scrollTo(0, 0);
}

}

function docRow(d) {

}
function vHome() {
  const ds = load("mabu_docs", []);

/* ---------- chamadas à IA (com partes e cache) ---------- */

    if (!s) throw U("A IA da demonstração só funciona dentro do Claude. Use a versão da Vercel.");

    catch (e) { throw U(e.code === "not_granted" ? "Permita o uso do Claude para gerar." : e.code === "rate_limited" ? "Muitos pedidos. Espere um pouco e tente de novo." : "A IA não respondeu direito. Tente de novo."); }

}

  return topbar("Estudo") +
  `<div class="card"><b>Cartões de hoje</b><p class="mut">${cd.length ? `${cd.length} cartão(ões) para revisar.` : `${cs.length} no baralho, nenhum para hoje.`}</p>${cd.length ? `<button class="btn inl" onclick="revisarCartoes(load('mabu_cards',[]).filter(c=>c.due<=Date.now()),load('mabu_cards',[]))">Revisar cartões</button>` : ""}</div>
  <div class="card"><b>Questões para rever</b><p class="mut">${rd.length ? `${rd.length} questão(ões) que você errou.` : "Nenhuma questão para hoje."}</p>${rd.length ? `<button class="btn inl" onclick="revisarErros()">Revisar erros</button>` : ""}</div>
  <h2 class="h">Rendimento por disciplina</h2>` +
  (Object.keys(por).map(n => { const o = por[n], pc = Math.round(100 * o.a / o.t); return `<div class="card"><b>${esc(n)}</b> <small class="mut">${o.n} teste(s): ${o.a} acertos, ${o.t - o.a} erros</small><div class="bar" role="img" aria-label="${pc}% de acerto"><i style="width:${pc}%"></i></div><small class="mut">${pc}% de acerto</small></div>`; }).join("") || `<p class="mut">Faça um quiz para ver seu rendimento aqui.</p>`) +
  `<h2 class="h">Evolução nos testes</h2>` + (ult.length ? `<div class="card"><div style="display:flex;align-items:flex-end;gap:6px;height:110px" role="img" aria-label="Percentual de acerto nos últimos testes">${ult.map(x => { const pc = Math.round(100 * x.acertos / x.total); return `<div title="${esc(x.disc)}: ${pc}%" style="flex:1;background:var(--pri);height:${Math.max(pc, 3)}%;border-radius:3px 3px 0 0"></div>`; }).join("")}</div><small class="mut">Cada barra é um teste, do mais antigo ao mais recente.</small></div>` : `<p class="mut">Sem testes ainda.</p>`);
}
function revisarErros() {
  const rv = load("mabu_rev", []), now = Date.now(), dev = rv.filter(r => r.due <= now), resto = rv.filter(r => r.due > now);
  dev.forEach(r => { r.passo++; if (r.passo < INTERVALOS.length) { r.due = now + INTERVALOS[r.passo] * DIA; resto.push(r); } });
  save("mabu_rev", resto); iniciarQuiz(dev.map(r => r.q), "Revisão", "medio", "estudo", true);
}

/* ---------- perfil, backup e créditos ---------- */
const CH = ["mabu_user", "mabu_hist", "mabu_rev", "mabu_cards", "mabu_resumos"];
function vPerfil() {
  return topbar("Perfil") + `<div class="card"><label for="nm" class="mut">Seu nome</label><input id="nm" value="${esc(nome())}" maxlength="20" onchange="save('mabu_user',this.value.trim()||'estudante')"></div>
  <div class="card"><b>${cred()} créditos</b><p class="mut">Resumos curtos e quizzes fáceis são grátis. Médio custa 1 crédito e extenso ou difícil, 2.</p><button class="btn inl" onclick="go('loja')">Obter créditos</button></div>
  <div class="card"><b>Idioma e região</b><p class="mut">O app, o resumo e o quiz podem ficar no idioma que você escolher.</p><select aria-label="Idioma" onchange="setLang(this.value)">${I.opts()}</select></div>
  <div class="card"><b>Medição de uso</b><p class="mut">Contamos visitas e ações gerais, como enviar um arquivo. Nunca o conteúdo dos seus documentos. <a href="/privacidade" style="color:var(--pri2)">Privacidade</a></p><button class="btn ghost inl" onclick="toggleGA()">${load("mabu_ga_off", false) ? "Ativar medição" : "Desativar medição"}</button></div>
  <div class="card"><b>Backup e troca de aparelho</b><p class="mut">Seus dados ficam neste aparelho. Exporte para guardar ou levar para outro.</p><div class="two"><button class="btn ghost" onclick="exportar()">Exportar</button><button class="btn ghost" onclick="$('#fim').click()">Importar</button></div><input type="file" id="fim" accept=".json" hidden onchange="importar(this)"></div>`;
}
function exportar() { baixar("mabudata-backup.json", JSON.stringify(Object.fromEntries(CH.map(k => [k, load(k, k === "mabu_user" ? "estudante" : [])]))), "application/json"); }
async function importar(el) { try { const d = JSON.parse(await el.files[0].text()); CH.forEach(k => d[k] !== undefined && save(k, d[k])); toast("Dados importados."); go("perfil"); } catch { toast("Arquivo de backup inválido."); } }
function vLoja() {
  return topbar("Créditos", lojaVolta) + `<h2 class="c" style="font-size:1.25rem">Precisa de mais créditos para resumos extensos e quizzes difíceis?</h2>
  <div class="card pack"><span class="tag">Mais escolhido</span><h2 style="margin:8px 0 0">Pacote Universitário</h2><p class="mut" style="margin:0">5 créditos por ${I.preco()}</p>
  <ul><li>Gere resumos extensos</li><li>Acesse quizzes difíceis</li><li>Sem prazo de validade</li><li>Compra única</li></ul><div class="price">${I.preco()}</div><h3 style="margin:12px 0 6px;font-size:1rem">Forma de pagamento</h3><div class="opts" style="grid-template-columns:1fr 1fr">${I.pay().map(p => `<button class="op ${selPay() === p.id ? "on" : ""}" aria-pressed="${selPay() === p.id}" onclick="sel.pay='${p.id}';go('loja')"><b>${p.n}</b><small>${p.d}</small></button>`).join("")}</div><p class="mut"><small>Ainda sem cobrança real nesta versão.</small></p><button class="btn" onclick="comprar()">Comprar agora →</button></div>
  <div class="card drow"><span style="flex:1"><b>Assistir a um anúncio</b><br><small class="mut">Ganhe 1 crédito grátis (até 3 por dia)</small></span><button class="btn ghost inl" onclick="anuncio()">Assistir</button></div>`;
}
const selPay = () => I.pay().some(p => p.id === sel.pay) ? sel.pay : I.pay()[0].id;
function comprar() { track("compra_clique", { metodo: selPay() }); toast("O pagamento ainda não está conectado nesta versão. Ele será ativado com o Google Play Billing ao publicar o app na loja."); }
function anuncio() {
  const hoje = new Date().toDateString(), a = load("mabu_ads", { d: hoje, n: 0 }); if (a.d !== hoje) { a.d = hoje; a.n = 0; }
  if (a.n >= 3) return toast("Você já usou os 3 anúncios de hoje. Volte amanhã.");
  let s = 5; ld(`Anúncio de demonstração… ${s}`);
  const t = setInterval(() => { if (--s > 0) return ld(`Anúncio de demonstração… ${s}`); clearInterval(t); a.n++; save("mabu_ads", a); track("anuncio_assistido"); setCred(cred() + 1); ld(); toast("+1 crédito ganho."); go("loja"); }, 1000);
}

go("capa");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
